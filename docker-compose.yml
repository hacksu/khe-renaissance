name: "khe-renaissance"

services:
  db:
    image: postgres:latest
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-khe}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d khe"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_internal
    volumes:
      - postgres_data:/var/lib/postgresql

  app:
    depends_on:
      db:
        condition: service_healthy
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@db:5432/khe}
      - ORIGIN=${ORIGIN}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - PUBLIC_JUDGE_APP_URL=${PUBLIC_JUDGE_APP_URL}
      - COOKIE_DOMAIN=${COOKIE_DOMAIN}
      - EXTRA_TRUSTED_ORIGINS=${EXTRA_TRUSTED_ORIGINS:-}
    networks:
      - app_internal
    volumes:
      - resumes:/app/resumes

  judge-app:
    depends_on:
      db:
        condition: service_healthy
    build:
      context: .
      dockerfile: judge-app/Dockerfile
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@db:5432/khe}
      - ORIGIN=${JUDGE_ORIGIN}
      - BETTER_AUTH_URL=${JUDGE_BETTER_AUTH_URL}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - MAIN_APP_URL=${MAIN_APP_URL}
      - COOKIE_DOMAIN=${COOKIE_DOMAIN}
      - EXTRA_TRUSTED_ORIGINS=${EXTRA_TRUSTED_ORIGINS:-}
    networks:
      - app_internal

networks:
  app_internal:

volumes:
  postgres_data:
  resumes:
